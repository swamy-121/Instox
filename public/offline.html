<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instox is offline</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #ffffff;
        color: #0a2c30;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
      }
      img { width: min(78vw, 280px); height: auto; }
      .tag { margin: 1rem 0 2rem; color: #5a6e71; letter-spacing: 0.04em; }
      h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
      p { line-height: 1.5; color: #5a6e71; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/wordmark.svg" alt="inStox" />
      <p class="tag">Instant Trading ideas</p>
      <h1>You are offline</h1>
      <p>Instox needs a connection for sign-in, tips, and payments. Sample pages may be unavailable too. Reconnect and try again.</p>
      <p>Private tips and account data are not stored on this device for offline use.</p>
    </main>
  </body>
</html>
